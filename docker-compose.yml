version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: millytour-postgres
    restart: always
    environment:
      POSTGRES_DB: millytour
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: millytour-backend
    restart: always
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/millytour?schema=public
      JWT_SECRET: super_secret_jwt_key_2026_millytour
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_SECRET_KEY: ${PAYME_SECRET_KEY:-}
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000,https://millytour.uz,https://admin.millytour.uz
    ports:
      - "4000:4000"

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: millytour-bot
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://backend:4000
      PARTNER_APP_URL: https://millytour.uz/partner/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: millytour-frontend
    restart: always
    ports:
      - "5173:5173"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: millytour-admin
    restart: always
    ports:
      - "3000:3000"

volumes:
  postgres_data:
